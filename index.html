<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #fafafa;
      color: #333;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    
    /* Sidebar */
    .sidebar {
      width: 240px;
      background: white;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      padding: 16px 0;
      overflow-y: auto;
    }
    
    .sidebar h1 {
      font-size: 18px;
      font-weight: 700;
      padding: 0 16px;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }
    
    .sidebar-section {
      font-size: 11px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 8px 16px;
      margin-top: 12px;
    }
    
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      margin: 0 8px;
      border-radius: 4px;
      color: #666;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    
    .nav-item:hover {
      background: #f5f5f5;
    }
    
    .nav-item.active {
      background: #e3f2fd;
      color: #1976d2;
      font-weight: 500;
    }
    
    .nav-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
    
    .badge {
      margin-left: auto;
      background: #f0f0f0;
      color: #666;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 3px;
    }
    
    .nav-item.active .badge {
      background: #1976d2;
      color: white;
    }
    
    /* Main content */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fafafa;
    }
    
    /* Top bar */
    .topbar {
      height: 56px;
      background: white;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
    }
    
    .topbar h2 {
      font-size: 16px;
      font-weight: 600;
    }
    
    .topbar-spacer {
      flex: 1;
    }
    
    .btn {
      padding: 8px 14px;
      border-radius: 4px;
      border: 1px solid #ddd;
      background: white;
      color: #333;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    
    .btn:hover {
      background: #f5f5f5;
      border-color: #ccc;
    }
    
    .btn-primary {
      background: #1976d2;
      color: white;
      border-color: #1976d2;
    }
    
    .btn-primary:hover {
      background: #1565c0;
      border-color: #1565c0;
    }
    
    /* Content area */
    .content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    
    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .left-panel {
      width: 280px;
      flex-shrink: 0;
      border-right: 1px solid #e0e0e0;
      background: white;
      overflow-y: auto;
      padding: 16px;
    }
    
    .company-card {
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 16px;
      background: #fafafa;
    }
    
    .company-card-header {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .company-avatar {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      background: #e3f2fd;
      color: #1976d2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
      flex-shrink: 0;
    }
    
    .company-info h3 {
      font-size: 14px;
      font-weight: 600;
    }
    
    .company-info p {
      font-size: 12px;
      color: #999;
      margin-top: 2px;
    }
    
    .field {
      margin-bottom: 12px;
    }
    
    .field-label {
      font-size: 11px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    
    .field-value {
      font-size: 13px;
      color: #333;
    }
    
    .field-value a {
      color: #1976d2;
      text-decoration: none;
    }
    
    .field-value a:hover {
      text-decoration: underline;
    }
    
    .divider {
      height: 1px;
      background: #e0e0e0;
      margin: 12px 0;
    }
    
    .contact-item {
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 10px;
      margin-bottom: 10px;
    }
    
    .contact-header {
      font-size: 11px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    
    .contact-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .contact-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #e3f2fd;
      color: #1976d2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 11px;
      flex-shrink: 0;
    }
    
    .contact-name {
      font-size: 13px;
      font-weight: 500;
    }
    
    .contact-title {
      font-size: 11px;
      color: #999;
    }
    
    .contact-info {
      font-size: 11px;
      color: #666;
      margin-top: 6px;
    }
    
    .contact-info span {
      display: block;
      margin: 2px 0;
    }
    
    /* Right panel */
    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
    }
    
    .tabs {
      display: flex;
      border-bottom: 1px solid #e0e0e0;
      background: white;
      padding: 0 16px;
    }
    
    .tab {
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 500;
      color: #666;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
    }
    
    .tab:hover {
      color: #333;
    }
    
    .tab.active {
      color: #1976d2;
      border-bottom-color: #1976d2;
    }
    
    .tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    
    /* Cards and lists */
    .section-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    
    .stat-card {
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
      background: white;
    }
    
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 16px;
    }
    
    .stat {
      background: #f5f5f5;
      border-radius: 4px;
      padding: 12px;
    }
    
    .stat-label {
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 4px;
    }
    
    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #333;
    }
    
    .stat-sub {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }
    
    .opportunity-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    
    .opp-name {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
    }
    
    .opp-amount {
      font-size: 13px;
      font-weight: 600;
      color: #333;
    }
    
    .badge-stage {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 3px;
      background: #f0f0f0;
      color: #666;
    }
    
    .timeline-item {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .timeline-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1976d2;
      margin-top: 6px;
      flex-shrink: 0;
    }
    
    .timeline-body {
      flex: 1;
    }
    
    .timeline-title {
      font-size: 13px;
      font-weight: 500;
    }
    
    .timeline-desc {
      font-size: 12px;
      color: #999;
      margin-top: 2px;
    }
    
    .timeline-time {
      font-size: 11px;
      color: #ccc;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <h1>📊 CRM</h1>
  
  <div class="sidebar-section">Navigation</div>
  <div class="nav-item active" onclick="goToPage('accounts')">
    <span class="nav-icon">👥</span>
    Accounts
    <span class="badge">248</span>
  </div>
  <div class="nav-item" onclick="goToPage('leads')">
    <span class="nav-icon">🔥</span>
    Leads
    <span class="badge">12</span>
  </div>
  <div class="nav-item" onclick="goToPage('contacts')">
    <span class="nav-icon">📋</span>
    Contacts
  </div>
  <div class="nav-item" onclick="goToPage('opportunities')">
    <span class="nav-icon">💰</span>
    Opportunities
  </div>
  
  <div class="sidebar-section">Settings</div>
  <div class="nav-item" onclick="goToPage('settings')">
    <span class="nav-icon">⚙️</span>
    Settings
  </div>
</aside>

<!-- Main content -->
<main class="main">
  <div class="topbar">
    <h2 id="page-title">Accounts</h2>
    <div class="topbar-spacer"></div>
    <input type="text" placeholder="Search..." style="padding: 6px 10px; border: 1px solid #ddd; border-radius: 4px; width: 160px;">
    <button class="btn btn-primary">+ New</button>
  </div>
  
  <div class="content" id="content-area">
    <!-- Left panel and right panel will be rendered here -->
  </div>
</main>

<script>
// Simple SPA routing
const pages = {
  accounts: renderAccountsPage,
  leads: renderLeadsPage,
  contacts: renderContactsPage,
  opportunities: renderOpportunitiesPage,
  settings: renderSettingsPage
};

function goToPage(page) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`[onclick="goToPage('${page}')"]`).classList.add('active');
  
  const title = {
    accounts: 'OptimasYs Technologies',
    leads: 'Active Leads',
    contacts: 'Contacts',
    opportunities: 'Sales Pipeline',
    settings: 'Settings'
  }[page];
  
  document.getElementById('page-title').textContent = title;
  
  if (pages[page]) pages[page]();
}

function renderAccountsPage() {
  const html = `
    <div class="left-panel">
      <div class="company-card">
        <div class="company-card-header">
          <div class="company-avatar">OT</div>
          <div class="company-info">
            <h3>OptimasYs Tech.</h3>
            <p>United States</p>
          </div>
        </div>
      </div>
      
      <div class="field">
        <div class="field-label">Account Owner</div>
        <div class="field-value">Sarah Johnson</div>
      </div>
      
      <div class="field">
        <div class="field-label">Industry</div>
        <div class="field-value">Consulting</div>
      </div>
      
      <div class="field">
        <div class="field-label">Website</div>
        <div class="field-value"><a href="#">www.ost.com</a></div>
      </div>
      
      <div class="field">
        <div class="field-label">Phone</div>
        <div class="field-value">+1 212 854 75 12</div>
      </div>
      
      <div class="divider"></div>
      
      <div class="contact-item">
        <div class="contact-header">Primary Contact</div>
        <div class="contact-row">
          <div class="contact-avatar">AW</div>
          <div>
            <div class="contact-name">Alexander Wilson</div>
            <div class="contact-title">CEO</div>
          </div>
        </div>
        <div class="contact-info">
          <span>📧 a.wilson@ost.com</span>
          <span>📱 +1 212 555 0133</span>
        </div>
      </div>
    </div>
    
    <div class="right-panel">
      <div class="tabs">
        <div class="tab active" onclick="switchTab(this, 'analytics')">Overview</div>
        <div class="tab" onclick="switchTab(this, 'timeline')">Timeline</div>
        <div class="tab" onclick="switchTab(this, 'opportunities')">Opportunities</div>
      </div>
      
      <div class="tab-content" id="tab-content">
        <div class="stat-grid">
          <div class="stat">
            <div class="stat-label">Annual Revenue</div>
            <div class="stat-value">$2.4M</div>
            <div class="stat-sub">+12% vs last year</div>
          </div>
          <div class="stat">
            <div class="stat-label">Total Deals</div>
            <div class="stat-value">4</div>
            <div class="stat-sub">2 active</div>
          </div>
        </div>
        
        <div class="section-title">Open Opportunities</div>
        <div class="opportunity-item">
          <div class="opp-name">Enterprise License Renewal</div>
          <div class="badge-stage">Proposal</div>
          <div class="opp-amount">$128K</div>
        </div>
        <div class="opportunity-item">
          <div class="opp-name">Implementation Services</div>
          <div class="badge-stage">Negotiation</div>
          <div class="opp-amount">$48K</div>
        </div>
      </div>
    </div>
  `;
  
  document.getElementById('content-area').innerHTML = html;
}

function renderLeadsPage() {
  const html = `
    <div class="left-panel">
      <p style="color: #999; font-size: 13px; text-align: center; padding: 20px;">No lead selected</p>
    </div>
    
    <div class="right-panel">
      <div class="tabs">
        <div class="tab active">All Leads</div>
      </div>
      
      <div class="tab-content">
        <div class="section-title">Hot Leads</div>
        <div style="border: 1px solid #e0e0e0; border-radius: 4px; padding: 12px; margin-bottom: 12px;">
          <div style="font-weight: 500;">Sarah Chen - Nexus Digital</div>
          <div style="font-size: 12px; color: #999; margin-top: 4px;">$45K opportunity</div>
        </div>
        
        <div class="section-title" style="margin-top: 20px;">Warm Leads</div>
        <div style="border: 1px solid #e0e0e0; border-radius: 4px; padding: 12px; margin-bottom: 12px;">
          <div style="font-weight: 500;">Marcus Reid - Altitude SaaS</div>
          <div style="font-size: 12px; color: #999; margin-top: 4px;">$28K opportunity</div>
        </div>
        <div style="border: 1px solid #e0e0e0; border-radius: 4px; padding: 12px;">
          <div style="font-weight: 500;">Priya Nair - CloudBridge Inc.</div>
          <div style="font-size: 12px; color: #999; margin-top: 4px;">$62K opportunity</div>
        </div>
      </div>
    </div>
  `;
  
  document.getElementById('content-area').innerHTML = html;
}

function renderContactsPage() {
  const html = `
    <div class="right-panel" style="border: none;">
      <div class="tabs">
        <div class="tab active">Contacts</div>
      </div>
      
      <div class="tab-content">
        <div class="section-title">All Contacts</div>
        <div style="font-size: 13px; color: #999;">No contacts to display</div>
      </div>
    </div>
  `;
  
  document.getElementById('content-area').innerHTML = html;
}

function renderOpportunitiesPage() {
  const html = `
    <div class="right-panel" style="border: none;">
      <div class="tabs">
        <div class="tab active">Pipeline</div>
      </div>
      
      <div class="tab-content">
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;">
          <div style="border: 1px solid #e0e0e0; border-radius: 4px; padding: 12px;">
            <div style="font-size: 12px; font-weight: 600; color: #999; margin-bottom: 8px;">DISCOVERY</div>
            <div style="font-size: 20px; font-weight: 700;">3</div>
          </div>
          <div style="border: 1px solid #e0e0e0; border-radius: 4px; padding: 12px;">
            <div style="font-size: 12px; font-weight: 600; color: #999; margin-bottom: 8px;">PROPOSAL</div>
            <div style="font-size: 20px; font-weight: 700;">2</div>
          </div>
          <div style="border: 1px solid #e0e0e0; border-radius: 4px; padding: 12px;">
            <div style="font-size: 12px; font-weight: 600; color: #999; margin-bottom: 8px;">NEGOTIATION</div>
            <div style="font-size: 20px; font-weight: 700;">1</div>
          </div>
          <div style="border: 1px solid #e0e0e0; border-radius: 4px; padding: 12px;">
            <div style="font-size: 12px; font-weight: 600; color: #999; margin-bottom: 8px;">CLOSING</div>
            <div style="font-size: 20px; font-weight: 700;">1</div>
          </div>
        </div>
      </div>
    </div>
  `;
  
  document.getElementById('content-area').innerHTML = html;
}

function renderSettingsPage() {
  const html = `
    <div class="right-panel" style="border: none;">
      <div class="tabs">
        <div class="tab active">Settings</div>
      </div>
      
      <div class="tab-content">
        <div class="section-title">Account Settings</div>
        <div style="font-size: 13px; color: #999;">Settings coming soon</div>
      </div>
    </div>
  `;
  
  document.getElementById('content-area').innerHTML = html;
}

function switchTab(el, tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  
  const tabContents = {
    analytics: `
      <div class="stat-grid">
        <div class="stat">
          <div class="stat-label">Annual Revenue</div>
          <div class="stat-value">$2.4M</div>
          <div class="stat-sub">+12% vs last year</div>
        </div>
        <div class="stat">
          <div class="stat-label">Total Deals</div>
          <div class="stat-value">4</div>
          <div class="stat-sub">2 active</div>
        </div>
      </div>
      
      <div class="section-title">Open Opportunities</div>
      <div class="opportunity-item">
        <div class="opp-name">Enterprise License Renewal</div>
        <div class="badge-stage">Proposal</div>
        <div class="opp-amount">$128K</div>
      </div>
      <div class="opportunity-item">
        <div class="opp-name">Implementation Services</div>
        <div class="badge-stage">Negotiation</div>
        <div class="opp-amount">$48K</div>
      </div>
    `,
    timeline: `
      <div class="section-title">Recent Activity</div>
      <div class="timeline-item">
        <div class="timeline-dot"></div>
        <div class="timeline-body">
          <div class="timeline-title">Call with Alexander Wilson</div>
          <div class="timeline-desc">Discussed Q3 renewal terms</div>
          <div class="timeline-time">Today · 2:15 PM</div>
        </div>
      </div>
      <div class="timeline-item">
        <div class="timeline-dot"></div>
        <div class="timeline-body">
          <div class="timeline-title">Proposal sent</div>
          <div class="timeline-desc">$128,000 ACV, 3-year term</div>
          <div class="timeline-time">Yesterday · 11:00 AM</div>
        </div>
      </div>
      <div class="timeline-item">
        <div class="timeline-dot"></div>
        <div class="timeline-body">
          <div class="timeline-title">Meeting scheduled</div>
          <div class="timeline-desc">Roadmap presentation to 4 stakeholders</div>
          <div class="timeline-time">Jun 12 · 10:00 AM</div>
        </div>
      </div>
    `,
    opportunities: `
      <div class="section-title">Active Deals</div>
      <div class="opportunity-item">
        <div class="opp-name">Enterprise License Renewal — FY25</div>
        <div class="badge-stage">Proposal</div>
        <div class="opp-amount">$128K</div>
      </div>
      <div class="opportunity-item">
        <div class="opp-name">Implementation Services — Phase 2</div>
        <div class="badge-stage">Negotiation</div>
        <div class="opp-amount">$48K</div>
      </div>
      <div class="opportunity-item">
        <div class="opp-name">Add-on: Analytics Module</div>
        <div class="badge-stage">Discovery</div>
        <div class="opp-amount">$22K</div>
      </div>
      <div class="opportunity-item">
        <div class="opp-name">Support Upgrade — Platinum Tier</div>
        <div class="badge-stage">Closing</div>
        <div class="opp-amount">$18.5K</div>
      </div>
    `
  };
  
  document.getElementById('tab-content').innerHTML = tabContents[tab] || '';
}

// Initialize
goToPage('accounts');
</script>
</body>
</html>
