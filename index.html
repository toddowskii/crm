<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM — NexusCRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --bg2: #161820;
      --bg3: #1e2029;
      --bg4: #252733;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.12);
      --text: #e8eaf0;
      --text2: #8b8fa8;
      --text3: #555870;
      --accent: #6366f1;
      --accent2: #818cf8;
      --accent-bg: rgba(99,102,241,0.12);
      --green: #22c55e;
      --green-bg: rgba(34,197,94,0.1);
      --amber: #f59e0b;
      --amber-bg: rgba(245,158,11,0.1);
      --red: #ef4444;
      --red-bg: rgba(239,68,68,0.1);
      --blue: #3b82f6;
      --blue-bg: rgba(59,130,246,0.1);
      --radius: 8px;
      --radius-lg: 12px;
      --sidebar-w: 220px;
      --font: 'DM Sans', sans-serif;
      --mono: 'DM Mono', monospace;
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
      font-size: 14px;
      line-height: 1.5;
    }
    /* SIDEBAR */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      padding: 0;
    }
    .sidebar-logo {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.3px;
    }
    .logo-icon {
      width: 28px; height: 28px;
      background: var(--accent);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: #fff;
    }
    .sidebar-section {
      padding: 12px 12px 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text3);
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      margin: 1px 8px;
      border-radius: var(--radius);
      color: var(--text2);
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 400;
      transition: all 0.15s;
      user-select: none;
    }
    .nav-item:hover { background: var(--bg3); color: var(--text); }
    .nav-item.active { background: var(--accent-bg); color: var(--accent2); font-weight: 500; }
    .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.8; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .nav-item.active svg { opacity: 1; }
    .nav-badge {
      margin-left: auto;
      background: var(--accent-bg);
      color: var(--accent2);
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 10px;
      font-family: var(--mono);
    }
    .sidebar-footer {
      margin-top: auto;
      padding: 12px;
      border-top: 1px solid var(--border);
    }
    .user-row {
      display: flex; align-items: center; gap: 10px;
      padding: 8px;
      border-radius: var(--radius);
      cursor: pointer;
    }
    .user-row:hover { background: var(--bg3); }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600; color: #fff;
      flex-shrink: 0;
    }
    .user-name { font-size: 13px; font-weight: 500; }
    .user-role { font-size: 11px; color: var(--text3); }
    /* MAIN */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
    /* TOP BAR */
    .topbar {
      height: 56px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      flex-shrink: 0;
    }
    .back-btn {
      display: flex; align-items: center; gap: 5px;
      color: var(--text2);
      font-size: 13px;
      cursor: pointer;
      padding: 5px 8px;
      border-radius: var(--radius);
      transition: all 0.15s;
    }
    .back-btn:hover { background: var(--bg3); color: var(--text); }
    .topbar-title { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
    .topbar-tags { display: flex; gap: 6px; margin-left: 8px; }
    .tag {
      font-size: 11px; font-weight: 500;
      padding: 2px 9px;
      border-radius: 10px;
      border: 1px solid var(--border2);
      color: var(--text2);
      cursor: pointer;
    }
    .tag.vip { background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.3); color: var(--amber); }
    .tag.usa { background: var(--blue-bg); border-color: rgba(59,130,246,0.3); color: var(--blue); }
    .topbar-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .btn {
      padding: 6px 14px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
      font-family: var(--font);
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #5254cc; }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border2);
      color: var(--text2);
    }
    .btn-ghost:hover { background: var(--bg3); color: var(--text); }
    /* CONTENT */
    .content { flex: 1; display: flex; overflow: hidden; }
    /* LEFT PANEL */
    .left-panel {
      width: 260px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px;
      background: var(--bg);
    }
    .company-header {
      display: flex; align-items: center; gap: 12px;
      padding: 12px;
      background: var(--bg2);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .company-logo {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: var(--accent-bg);
      border: 1px solid rgba(99,102,241,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: var(--accent2);
    }
    .company-name { font-size: 13.5px; font-weight: 600; }
    .company-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }
    .field-group { margin-bottom: 14px; }
    .field-label { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-bottom: 5px; }
    .field-value { font-size: 13px; color: var(--text); }
    .field-value a { color: var(--accent2); text-decoration: none; }
    .field-value a:hover { text-decoration: underline; }
    .field-value.pill {
      display: inline-flex; align-items: center;
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 12px;
    }
    .pill-partner { background: var(--accent-bg); color: var(--accent2); }
    .pill-consulting { background: var(--green-bg); color: var(--green); }
    .pill-vip { background: var(--amber-bg); color: var(--amber); }
    .divider { height: 1px; background: var(--border); margin: 14px 0; }
    .contact-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px;
    }
    .contact-card-header {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text3); margin-bottom: 10px;
    }
    .contact-row { display: flex; align-items: center; gap: 10px; }
    .contact-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--blue-bg);
      border: 1px solid rgba(59,130,246,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; color: var(--blue);
      flex-shrink: 0;
    }
    .contact-name { font-size: 13px; font-weight: 500; }
    .contact-meta { font-size: 11px; color: var(--text3); margin-top: 1px; }
    .contact-info { margin-top: 10px; }
    .contact-info-row { display: flex; gap: 6px; font-size: 12px; color: var(--text2); padding: 3px 0; }
    .contact-info-row span:first-child { color: var(--text3); width: 70px; flex-shrink: 0; }
    /* RIGHT PANEL */
    .right-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
    /* TABS */
    .tabs {
      display: flex;
      gap: 2px;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }
    .tab {
      padding: 14px 14px 12px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text3);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
      user-select: none;
      white-space: nowrap;
    }
    .tab:hover { color: var(--text2); }
    .tab.active { color: var(--accent2); border-bottom-color: var(--accent); }
    /* TAB CONTENT */
    .tab-content { flex: 1; overflow-y: auto; padding: 20px; }
    /* ANALYTICS */
    .analytics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .analytics-grid.full { grid-template-columns: 1fr; }
    .stat-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
    }
    .stat-card-title {
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text3); margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
    }
    .stat-dot { width: 7px; height: 7px; border-radius: 50%; }
    .stat-num { font-size: 26px; font-weight: 600; letter-spacing: -0.5px; color: var(--text); font-family: var(--mono); }
    .stat-num span { font-size: 14px; font-weight: 400; color: var(--text3); }
    .stat-sub { font-size: 12px; color: var(--text3); margin-top: 4px; }
    .stat-badge {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 11px; font-weight: 500;
      padding: 2px 7px; border-radius: 6px; margin-top: 6px;
    }
    .badge-up { background: var(--green-bg); color: var(--green); }
    .badge-down { background: var(--red-bg); color: var(--red); }
    /* BAR CHART */
    .bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 80px; margin-top: 12px; }
    .bar-col { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; }
    .bar {
      width: 100%; border-radius: 4px 4px 0 0;
      transition: opacity 0.15s;
      cursor: pointer;
    }
    .bar:hover { opacity: 0.8; }
    .bar-label { font-size: 9px; color: var(--text3); font-family: var(--mono); }
    /* PIPELINE */
    .pipeline { display: flex; gap: 10px; margin-top: 16px; }
    .pipeline-stage {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
    }
    .pipeline-stage-name { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .pipeline-count { font-size: 22px; font-weight: 600; font-family: var(--mono); color: var(--text); }
    .pipeline-bar { height: 3px; border-radius: 2px; margin-top: 8px; background: var(--bg4); overflow: hidden; }
    .pipeline-fill { height: 100%; border-radius: 2px; }
    /* LEAD CARD */
    .lead-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .lead-item:hover { border-color: var(--border2); background: var(--bg3); }
    .lead-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600;
      flex-shrink: 0;
    }
    .lead-name { font-size: 13px; font-weight: 500; }
    .lead-company { font-size: 11px; color: var(--text3); }
    .lead-status {
      margin-left: auto;
      font-size: 11px; font-weight: 500;
      padding: 2px 8px; border-radius: 6px;
    }
    .status-hot { background: var(--red-bg); color: var(--red); }
    .status-warm { background: var(--amber-bg); color: var(--amber); }
    .status-cold { background: var(--blue-bg); color: var(--blue); }
    .status-new { background: var(--accent-bg); color: var(--accent2); }
    .lead-amount { font-size: 12px; font-weight: 500; color: var(--text2); margin-left: 8px; font-family: var(--mono); }
    /* TIMELINE */
    .timeline-item { display: flex; gap: 14px; margin-bottom: 18px; position: relative; }
    .timeline-line { position: absolute; left: 11px; top: 22px; bottom: -18px; width: 1px; background: var(--border); }
    .timeline-dot { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 10px; }
    .timeline-body { flex: 1; }
    .timeline-title { font-size: 13px; font-weight: 500; }
    .timeline-desc { font-size: 12px; color: var(--text3); margin-top: 2px; }
    .timeline-time { font-size: 11px; color: var(--text3); margin-top: 4px; font-family: var(--mono); }
    /* COMMUNICATION */
    .comm-item {
      padding: 12px 14px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 8px;
    }
    .comm-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .comm-type { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; }
    .comm-date { font-size: 11px; color: var(--text3); font-family: var(--mono); }
    .comm-subject { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
    .comm-preview { font-size: 12px; color: var(--text3); }
    /* SALES */
    .opportunity-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .opportunity-row:hover { border-color: var(--border2); }
    .opp-name { font-size: 13px; font-weight: 500; flex: 1; }
    .opp-stage { font-size: 11px; padding: 2px 8px; border-radius: 6px; }
    .opp-amount { font-size: 13px; font-weight: 500; font-family: var(--mono); color: var(--text2); }
    .opp-prob { font-size: 11px; color: var(--text3); }
    .progress-mini { height: 3px; border-radius: 2px; background: var(--bg4); overflow: hidden; width: 60px; }
    .progress-fill { height: 100%; border-radius: 2px; background: var(--accent); }
    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 4px; }
    /* SECTION HEADER */
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .section-title { font-size: 13px; font-weight: 600; color: var(--text); }
    .section-action { font-size: 12px; color: var(--accent2); cursor: pointer; }
    /* NEWS */
    .news-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
    .news-item:last-child { border-bottom: none; }
    .news-source { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    .news-headline { font-size: 13px; font-weight: 500; margin: 4px 0; }
    .news-date { font-size: 11px; color: var(--text3); font-family: var(--mono); }
    /* QUICK SEARCH */
    .search-bar {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 6px 12px;
      margin: 0 20px 0 auto;
      width: 200px;
    }
    .search-bar input { background: none; border: none; outline: none; color: var(--text); font-size: 13px; width: 100%; font-family: var(--font); }
    .search-bar input::placeholder { color: var(--text3); }
    .icon-btn {
      width: 32px; height: 32px; border-radius: var(--radius);
      background: var(--bg3); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text2); transition: all 0.15s;
    }
    .icon-btn:hover { background: var(--bg4); color: var(--text); }
    svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>

<main id="main-area" class="main"></main>

<script>
/* PAGE DATA AND RENDERING */
const pages = {
  dashboard: {
    html: `
    <div class="topbar">
      <div class="topbar-title">Dashboard</div>
      <div class="search-bar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Search...">
      </div>
      <div class="topbar-actions" style="margin-left:auto">
        <button class="btn btn-primary">+ New Record</button>
      </div>

function renderPage(pageKey) {
  const page = pages[pageKey];
  if (!page) return;
  document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
  let matching = document.querySelector('.nav-item[data-page="'+pageKey+'"]');
  if (matching) matching.classList.add('active');
  const main = document.getElementById('main-area');
  main.innerHTML = typeof page.html === 'function' ? page.html() : page.html;
  if (page.afterRender) setTimeout(()=>page.afterRender(), 1);
}

function renderAccountsTabs(tabId) {
  const tabStrip = document.getElementById('accounts-tabs');
  if (!tabStrip) return;
  tabStrip.innerHTML = accountsTabs.map(tab =>
    `<div class="tab${tab.id===tabId?' active':''}" data-tab="${tab.id}">${tab.name}</div>`
  ).join('');
  document.getElementById('accounts-tab-content').innerHTML = accountsTabContents[tabId];
  tabStrip.querySelectorAll('.tab').forEach(tab =>
    tab.onclick = () => renderAccountsTabs(tab.getAttribute('data-tab'))
  );
  setTimeout(()=>afterAccountsTabRender(tabId), 1);
}

function afterAccountsTabRender(tabId) {
  if(tabId==='analytics') renderAnalyticsCharts('accounts');
  if(tabId==='timeline') renderTimeline();
  if(tabId==='communication') renderComms();
  if(tabId==='sales') { renderOpps(); renderPipeline(); }
  if(tabId==='leads') renderLeads();
  if(tabId==='service') renderService();
  if(tabId==='news') renderNews();
}
